<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>Рой</title>
<style>
@font-face{font-family:'Rubik';font-style:normal;font-weight:300 900;font-display:swap;src:url(fonts/Rubik-cyrillic.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;}
@font-face{font-family:'Rubik';font-style:normal;font-weight:300 900;font-display:swap;src:url(fonts/Rubik-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;}
@font-face{font-family:'Rubik';font-style:normal;font-weight:300 900;font-display:swap;src:url(fonts/Rubik-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
@font-face{font-family:'Russo One';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/RussoOne-cyrillic.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;}
@font-face{font-family:'Russo One';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/RussoOne-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;}
@font-face{font-family:'Russo One';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/RussoOne-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;}
:root{
  color-scheme:dark;
  --bg:#1b1120; --bg2:#2a1824; --warm:#4a2a18;
  --amber:#ffbf3c; --amber-hi:#ffe08a; --amber-deep:#7a4c0e;
  --coral:#ff5f4f; --coral-deep:#6a1d18;
  --violet:#b27dff; --grey:#b9ad9f;
  --sage:#9fd08a; --sage-deep:#2f5a33;
  --cream:#fff3d6; --ink:#1e130d;
  --panel:rgba(32,19,16,.9); --panel-line:rgba(255,191,60,.28);
  --font-display:"Russo One","Arial Black",Impact,sans-serif;
  --font-body:Rubik,"Trebuchet MS","Segoe UI",Roboto,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:max(16px,env(safe-area-inset-left,0px)); --sar:max(16px,env(safe-area-inset-right,0px));
  --ui:clamp(13px,1.1vmin + 9px,19px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:var(--font-body);font-size:var(--ui);color:var(--cream)}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:12px;pointer-events:none;
  padding:calc(var(--sat) + 8px) var(--sar) 8px var(--sal);background:linear-gradient(to bottom,rgba(18,10,14,.78),rgba(18,10,14,0))}
.ibtn{pointer-events:auto;flex:none;width:clamp(40px,4.5vmin + 22px,52px);height:clamp(40px,4.5vmin + 22px,52px);border-radius:14px;border:1px solid var(--panel-line);background:var(--panel);
  color:var(--amber);display:grid;place-items:center;cursor:pointer;transition:transform .08s}
.ibtn:active{transform:scale(.92)}
.ibtn svg{width:46%;height:46%}
.hinfo{display:flex;flex-direction:column;line-height:1.1;min-width:0}
#hLevel{font-family:var(--font-display);font-size:1.12em;color:var(--amber);white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#hTime{font-size:.82em;opacity:.8;white-space:nowrap;font-variant-numeric:tabular-nums}
#hTime.over{color:var(--coral);opacity:.9}
#bar{flex:1;min-width:60px;height:12px;border-radius:7px;overflow:hidden;display:flex;background:rgba(0,0,0,.4);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
#bar i{display:block;height:100%;transition:width .35s ease}
#barP{background:linear-gradient(var(--amber-hi),var(--amber))}
#barH{background:var(--violet)}
#barE{background:var(--coral)}

/* ability bar */
#dock{position:fixed;z-index:3;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 8px);width:calc(100% - 24px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#dockRow{display:flex;align-items:center;justify-content:center;gap:12px;min-height:clamp(58px,6vmin + 30px,74px);width:100%}
/* the send-share button sits at the right; a matching spacer on the left keeps the abilities centred */
#dockRow::before{content:"";flex:none;width:var(--sendW)}
#dockMid{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px}
#bSend{--sendW:clamp(58px,6vmin + 30px,74px);pointer-events:auto;flex:none;width:var(--sendW);height:var(--sendW);border-radius:50%;cursor:pointer;padding:0;
  border:2px solid var(--amber);background:radial-gradient(circle at 50% 35%,#4a2c14,#24150d);color:var(--cream);
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:transform .08s}
#bSend b{font-family:var(--font-display);font-size:1.15em;line-height:1;color:var(--amber-hi)}
#bSend small{font-size:.6em;margin-top:2px;opacity:.85}
#bSend:active{transform:scale(.92)}
#bSend:focus-visible{outline:3px solid var(--amber-hi);outline-offset:2px}
#dockRow{--sendW:clamp(58px,6vmin + 30px,74px)}
#abbar{display:flex;gap:clamp(10px,2vmin,18px)}
.ab{pointer-events:auto;position:relative;width:clamp(58px,6vmin + 30px,74px);height:clamp(58px,6vmin + 30px,74px);border-radius:50%;border:0;cursor:pointer;padding:0;
  background:radial-gradient(circle,#2d1b12 0 62%,transparent 63%),conic-gradient(var(--amber) calc(var(--p,1) * 1turn),rgba(255,255,255,.12) 0);
  display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .08s,filter .2s;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.ab svg{width:40%;height:40%;margin-top:-4px}
.ab b{font-weight:600;font-size:.62em;margin-top:1px;white-space:nowrap}
.ab:active{transform:scale(.92)}
.ab.cool{filter:saturate(.3) brightness(.8)}
.ab.armed{box-shadow:0 0 0 3px var(--amber-hi),0 0 22px rgba(255,191,60,.7);animation:armed .8s ease-in-out infinite alternate}
@keyframes armed{to{transform:scale(1.08)}}
@media (orientation:landscape) and (max-height:560px){
  #dock{left:auto;transform:none;right:var(--sar);top:calc(var(--sat) + 64px);bottom:calc(var(--sab) + 8px);width:clamp(150px,22vw,200px);justify-content:center}
  #dockRow{flex-direction:column;min-height:0;gap:8px;--sendW:54px}
  #dockRow::before{display:none}
  #dockMid{flex:none;flex-direction:column;gap:8px}
  #abbar{flex-direction:column;gap:8px}
  .ab{width:54px;height:54px}
}

#bX2{pointer-events:auto;max-width:240px;line-height:1.15}
#tip{width:min(360px,100%);padding:10px 14px;border-radius:14px;
  background:var(--panel);border:1px solid rgba(159,208,138,.4);text-align:center;line-height:1.35;font-size:.92em;pointer-events:none;transition:opacity .6s}
#tip.fade{opacity:0}
@media (orientation:landscape) and (max-height:560px){ #tip{font-size:.8em;padding:8px 10px} }
#toast{position:fixed;z-index:4;left:50%;top:calc(var(--sat) + 74px);transform:translate(-50%,-8px);padding:8px 14px;border-radius:12px;background:var(--panel);
  border:1px solid var(--panel-line);font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* buttons */
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;min-height:50px;padding:12px 18px;border-radius:16px;border:0;cursor:pointer;
  font-family:var(--font-display);font-size:1.08em;letter-spacing:.01em;background:linear-gradient(var(--amber-hi),var(--amber));color:var(--ink);
  box-shadow:0 5px 0 var(--amber-deep),0 8px 18px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--amber-deep),0 4px 10px rgba(0,0,0,.35)}
.btn.sec{background:rgba(255,243,214,.06);color:var(--cream);border:1px solid var(--panel-line);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.btn.sec:active{box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.rw{width:auto;min-height:44px;padding:10px 16px;font-size:.92em;background:linear-gradient(#bff0a6,var(--sage));box-shadow:0 4px 0 var(--sage-deep),0 8px 18px rgba(0,0,0,.35)}
.btn small{font-family:var(--font-body);font-size:.7em;font-weight:600;opacity:.75}
.row{display:flex;gap:10px;width:100%}

/* screens */
.scr{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;
  padding:calc(var(--sat) + 12px) var(--sar) calc(var(--sab) + 12px) var(--sal)}
.scr.show{display:flex;animation:fadein .25s ease-out}
@keyframes fadein{from{opacity:0}}
.modal{background:rgba(12,6,12,.6)}
.card{width:min(360px,100%);max-height:100%;overflow:auto;padding:24px 20px 20px;border-radius:22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;
  background:linear-gradient(165deg,#3d2617,#231427 75%);border:1px solid var(--panel-line);box-shadow:0 24px 60px rgba(0,0,0,.55);animation:pop .3s cubic-bezier(.2,1.4,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card h2{margin:0;font:1.7em/1.1 var(--font-display);color:var(--amber)}
.card.lose h2{color:var(--coral)}
.card p{margin:0;opacity:.85;line-height:1.35}
.badge{font-family:var(--font-display);font-size:.8em;padding:5px 12px;border-radius:99px;background:var(--sage);color:var(--ink)}
#iIcon{width:110px;height:110px}
#iSvg{width:84px;height:84px;color:var(--amber)}
#iSvg svg{width:100%;height:100%}

#sMenu{background:radial-gradient(ellipse at 50% 45%,rgba(24,14,22,.72),rgba(12,7,12,.9))}
.menuwrap{width:min(340px,100%);display:flex;flex-direction:column;align-items:center;gap:12px}
.logo{display:flex;flex-direction:column;align-items:center;margin-bottom:6px}
.logo svg{width:clamp(90px,16vmin,150px);height:auto;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5))}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.logo h1{margin:4px 0 0;font:clamp(48px,9vmin,84px)/1 var(--font-display);color:var(--amber);letter-spacing:.04em;text-shadow:0 4px 0 var(--amber-deep),0 10px 30px rgba(0,0,0,.5)}
.btn.big{min-height:68px;font-size:1.45em}
@media (orientation:landscape) and (max-height:560px){
  .menuwrap{width:min(560px,100%);display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:10px 18px}
  .logo{grid-row:1 / span 3}
  .card{padding:16px;gap:8px}
  .card h2{font-size:1.4em}
}

.panel{flex-direction:column;justify-content:flex-start;background:linear-gradient(rgba(20,12,16,.94),rgba(27,17,32,.97));gap:10px}
.panel header{width:min(560px,100%);display:flex;align-items:center;gap:12px;flex:none}
.panel header h2{margin:0;font:1.4em var(--font-display);color:var(--amber);flex:1}
.scroll{touch-action:pan-y;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;width:min(560px,100%);flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:rgba(255,191,60,.35) transparent}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,191,60,.35);border-radius:3px}
#lvStars{font-family:var(--font-display);color:var(--amber-hi);white-space:nowrap}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 4px;padding:6px 6px 60px}
.cell{position:relative;aspect-ratio:1/0.9;border:0;padding:0;cursor:pointer;background:none}
.cell:nth-child(4n+2),.cell:nth-child(4n+4){transform:translateY(50%)}
.cell .hx{position:absolute;inset:0;clip-path:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%);background:linear-gradient(160deg,var(--amber-hi),var(--amber) 55%,#d48c1c);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);transition:transform .1s}
.cell:active .hx{transform:scale(.92)}
.cell .num{font:clamp(18px,3.4vmin + 6px,28px)/1 var(--font-display)}
.cell .st{display:flex;gap:1px;margin-top:3px}
.cell .st svg{width:clamp(10px,1.6vmin + 4px,15px);height:auto}
.cell.locked .hx{background:linear-gradient(160deg,#4d4038,#2f2622);color:rgba(255,243,214,.35)}
.cell.cur .hx{background:linear-gradient(160deg,#fff4c4,var(--amber-hi) 60%,var(--amber));box-shadow:none;animation:cur 1.2s ease-in-out infinite alternate}
@keyframes cur{to{filter:brightness(1.15)}}

.stars{display:flex;gap:10px;justify-content:center;height:64px;align-items:flex-end}
.stars svg{width:54px;height:54px;transform:scale(0);transition:transform .35s cubic-bezier(.2,1.8,.5,1)}
.stars svg:nth-child(2){width:64px;height:64px}
.stars svg.on{transform:scale(1)}
#wList{list-style:none;margin:0;padding:0;font-size:.9em;text-align:left;display:flex;flex-direction:column;gap:4px}
#wList li{opacity:.55}#wList li.ok{opacity:1}
#wList li::before{content:'✗';display:inline-block;width:1.4em;color:var(--coral)}
#wList li.ok::before{content:'✓';color:var(--sage)}

.hitem{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid rgba(255,191,60,.12)}
.hitem canvas,.hitem .sv{flex:none;width:52px;height:52px;color:var(--amber)}
.hitem .sv svg{width:100%;height:100%}
.hitem h3{margin:0 0 2px;font:1em var(--font-display);color:var(--amber-hi)}
.hitem p{margin:0;line-height:1.35;opacity:.88;font-size:.92em}
.hsec{font:1.05em var(--font-display);color:var(--amber);margin:16px 4px 2px}
#licText{white-space:pre-wrap;font:12px/1.4 ui-monospace,Consolas,monospace;background:rgba(0,0,0,.3);padding:12px;border-radius:10px;margin:10px 0 40px;opacity:.85;user-select:text;-webkit-user-select:text}
.about p{line-height:1.45}

#curtain{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%,#3d2617,#120a10);transition:opacity .22s}
#curtain.on{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
<script>window.__sdkPromise = Promise.resolve(false);</script>

<body>
<canvas id="cv"></canvas>

<div id="hud" class="hide">
  <button id="bPause" class="ibtn" type="button" data-i18n-label="paused"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button>
  <div class="hinfo"><div id="hLevel"></div><div id="hTime"></div></div>
  <div id="bar"><i id="barP"></i><i id="barH"></i><i id="barE"></i></div>
</div>

<div id="dock" class="hide">
  <div id="tip" class="hide"></div>
  <div id="dockRow">
  <div id="dockMid">
  <button id="bX2" class="btn rw hide" type="button" data-i18n="rw_x2"></button>
  <div id="abbar">
  <button class="ab" id="ab_honey" type="button"><svg viewBox="0 0 24 24" fill="#ffbf3c"><path d="M12 2c3 4.5 6 8 6 11.5A6 6 0 0 1 6 13.5C6 10 9 6.5 12 2z"/><path d="M9.5 14a2.5 2.5 0 0 0 2.5 2.5" stroke="#fff3d6" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg><b data-i18n="ab_honey"></b></button>
  <button class="ab" id="ab_boost" type="button"><svg viewBox="0 0 24 24" fill="#ffe08a"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg><b data-i18n="ab_boost"></b></button>
  <button class="ab" id="ab_smoke" type="button"><svg viewBox="0 0 24 24" fill="#d8cfc4"><circle cx="8" cy="14" r="5"/><circle cx="15" cy="11" r="6"/><circle cx="17" cy="17" r="4"/></svg><b data-i18n="ab_smoke"></b></button>
  </div>
  </div>
  <button id="bSend" type="button"><b id="bSendPct">50%</b><small data-i18n="send"></small></button>
  </div>
</div>
<div id="toast"></div>

<section id="sMenu" class="scr">
  <div class="menuwrap">
    <div class="logo">
      <svg viewBox="0 0 120 100" aria-hidden="true">
        <ellipse cx="44" cy="30" rx="20" ry="13" fill="#fff3d6" opacity=".75" transform="rotate(-25 44 30)"/>
        <ellipse cx="70" cy="26" rx="20" ry="13" fill="#fff3d6" opacity=".6" transform="rotate(20 70 26)"/>
        <ellipse cx="58" cy="60" rx="34" ry="24" fill="#ffbf3c"/>
        <path d="M40 40 q-6 20 0 40 h10 q-6 -20 0 -40z M62 36 q-6 24 0 48 h10 q-6 -24 0 -48z" fill="#1e130d"/>
        <circle cx="92" cy="56" r="13" fill="#1e130d"/>
        <circle cx="96" cy="52" r="3" fill="#fff3d6"/>
        <path d="M24 60 l-12 2 l12 4z" fill="#1e130d"/>
        <path d="M96 44 q4 -12 12 -14 M90 44 q0 -12 6 -18" stroke="#1e130d" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
      <h1 data-title></h1>
    </div>
    <button id="mPlay" class="btn big" type="button"><span data-i18n="play"></span><small id="mLvl"></small></button>
    <div class="row"><button id="mLevels" class="btn sec" type="button" data-i18n="levels"></button><button id="mHow" class="btn sec" type="button" data-i18n="howto"></button></div>
    <div class="row"><button id="mSound" class="btn sec" type="button"></button><button id="mAbout" class="btn sec" type="button" data-i18n="about"></button></div>
  </div>
</section>

<section id="sLevels" class="scr panel">
  <header><button id="lvBack" class="ibtn" type="button" data-i18n-label="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h2 data-i18n="levels"></h2><span id="lvStars"></span></header>
  <div id="lvGrid" class="scroll grid"></div>
</section>

<section id="sPause" class="scr modal"><div class="card">
  <h2 data-i18n="paused"></h2>
  <button id="pResume" class="btn" type="button" data-i18n="resume"></button>
  <div class="row"><button id="pRestart" class="btn sec" type="button" data-i18n="restart"></button><button id="pLevels" class="btn sec" type="button" data-i18n="levels"></button></div>
  <div class="row"><button id="pHow" class="btn sec" type="button" data-i18n="howto"></button><button id="pSound" class="btn sec" type="button"></button></div>
</div></section>

<section id="sWin" class="scr modal"><div class="card">
  <h2 data-i18n="win"></h2>
  <div class="stars" id="wStars"></div>
  <ul id="wList"></ul>
  <p id="wTime"></p>
  <button id="wNext" class="btn" type="button" data-i18n="next"></button>
